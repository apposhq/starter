[env]
_.path = ["./node_modules/.bin", "./vendor/bin"]
FORCE_COLOR = "1"
NODE_OPTIONS = "--no-warnings"
PHP_EXTRA_CONFIGURE_OPTIONS = "{% if os() == 'macos' %}--with-pdo-pgsql=/opt/homebrew/opt/libpq --with-pgsql=/opt/homebrew/opt/libpq{% else %}--with-pdo-pgsql --with-pgsql --without-sqlite3 --without-pdo-sqlite --disable-gd{% endif %}"

[bootstrap.hooks]
pre-packages = """
if command -v apt-get >/dev/null 2>&1; then
  if [ "$(id -u)" -eq 0 ]; then apt-get update -qq; else sudo apt-get update -qq; fi
fi
"""

[bootstrap.packages]
"apt:autoconf" = "2.71-3"
"apt:bison" = "2:3.8.2+dfsg-1build2"
"apt:libcurl4-openssl-dev" = "latest"
"apt:libicu-dev" = "latest"
"apt:libonig-dev" = "6.9.9-1build1"
"apt:libpq-dev" = "latest"
"apt:libreadline-dev" = "8.2-4build1"
"apt:libssl-dev" = "latest"
"apt:libxml2-dev" = "latest"
"apt:pkg-config" = "1.8.1-2build1"
"apt:re2c" = "3.1-1build1"
"apt:zlib1g-dev" = "latest"
"brew:autoconf" = "2.73"
"brew:bison" = "3.8.2"
"brew:libiconv" = "1.19"
"brew:libpq" = "18.4"
"brew:pkgconf" = "3.0.4"
"brew:re2c" = "4.5.1"

[settings]
experimental = true
lockfile = true
quiet = true

[tools]
bun = "1.3.14"
claude = "2.1.220"
cloudflared = "2026.7.3"
node = "26.5.0"
oha = "1.15.0"
php = "8.5.0"

[tasks.cc]
description = "Run Claude Code with permission prompts skipped"
run = "claude --chrome --dangerously-skip-permissions"

[tasks.bootstrap]
description = "Install dependencies, start infra, and build (run via `mise bootstrap`)"
depends_post = ["up", "build"]
run = """
composer install
bun install
"""

[tasks.build]
description = "Build the frontend assets for production"
run = "vp build"

[tasks."build:ssr"]
description = "Build the frontend assets for production, including the SSR bundle"
depends = ["build"]
run = "vp build --ssr"

[tasks.check]
description = "Format, lint, typecheck, and run the tests"
depends = ["check:*"]

[tasks."check:js"]
description = "Format, lint, and typecheck the frontend"
run = "vp check --fix"

[tasks."check:php"]
description = "Format and lint the PHP code"
run = "pint --parallel"

[tasks."check:test"]
description = "Run the test suite"
depends = ["check:php", "up"]
run = "pest --compact"

[tasks."check:types"]
description = "Typecheck the PHP code"
depends = ["check:php"]
run = "phpstan analyse --memory-limit=1G"

[tasks.clean]
description = "Clean the project"
run = "rm -rf .playwright* frankenphp node_modules vendor"

[tasks.dev]
description = "Start the development environment"
depends = ["up"]
run = """
php artisan optimize:clear
php artisan dev
"""

[tasks.down]
description = "Stop and remove local infra containers, orphans, and volumes"
run = "docker compose --profile=app --profile=infra down --remove-orphans --timeout=0 --volumes"

[tasks.up]
description = "Start local infra containers"
run = """
if [ "$(docker compose --profile=infra ps --services --status running | sort)" != "$(docker compose --profile=infra config --services | sort)" ]; then
  docker compose --profile=infra up -d --wait
  # openobserve ships no healthcheck (distroless image - nothing to probe with), so --wait does not
  # gate on it. The app asks it for the RUM client token at boot, and losing that race turns browser
  # telemetry off for the whole session with only a log line to show for it.
  until curl -sf http://localhost:${OPENOBSERVE_PORT:-5080}/healthz >/dev/null 2>&1; do sleep 0.5; done
  # public/storage is gitignored and so absent from a fresh clone. --force because it outlives
  # `mise down`, which takes the containers and volumes but never touches the working copy.
  php artisan storage:link --force
  php artisan storage:bucket
  php artisan migrate --force
  php artisan db:seed --force
fi
"""

[tasks.preview]
description = "Preview the production build in the Docker Compose cluster"
depends = ["up"]
run = """
trap 'docker compose --profile=app down --remove-orphans --timeout=0 --volumes' EXIT
docker compose --profile=app up --build
"""
