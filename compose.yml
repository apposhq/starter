# Defined once so the credential is not repeated between openobserve and the services shipping it telemetry.
x-oo_user: &oo_user ${ZO_ROOT_USER_EMAIL:-root@example.com}
x-oo_password: &oo_password ${ZO_ROOT_USER_PASSWORD:-Password1!}

x-app_config: &app_config
  build:
    context: .
    dockerfile: ./Dockerfile
  environment:
    APP_ENV: ${APP_ENV:-preview}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-starter}
    AWS_ENDPOINT: ${AWS_ENDPOINT:-http://seaweedfs:8333}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-starter}
    DB_URL: ${DB_URL:-postgresql://postgres:postgres@postgres:5432/${POSTGRES_DB:-starter}}
    MAIL_URL: ${MAIL_URL:-smtp://mailpit:1025}
    OO_OTLP_ENDPOINT: ${OO_OTLP_ENDPOINT:-http://openobserve:5080/api/default}
    OO_PASSWORD: *oo_password
    OO_USER: *oo_user
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    REVERB_HOST: ${REVERB_HOST:-reverb}
  profiles:
    - app
  restart: unless-stopped
  stop_grace_period: 30s

configs:
  seaweedfs_s3:
    content: |
      {
        "identities": [
          {
            "name": "app",
            "credentials": [{ "accessKey": "${AWS_ACCESS_KEY_ID:-starter}", "secretKey": "${AWS_SECRET_ACCESS_KEY:-starter}" }],
            "actions": ["Admin", "Read", "Write", "List", "Tagging"]
          },
          {
            "name": "anonymous",
            "actions": ["Read:${PUBLIC_BUCKET_LOCAL:-starter-local-public}", "Read:${PUBLIC_BUCKET_PREVIEW:-starter-preview-public}"]
          }
        ]
      }

  postgres_initdb:
    content: |
      SELECT format('CREATE DATABASE %I', current_database() || '_test')
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = current_database() || '_test')
      \gexec

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-19beta1}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-starter}
      PGDATA: /home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    profiles:
      - infra
    configs:
      - source: postgres_initdb
        target: /docker-entrypoint-initdb.d/create-test-database.sql
    restart: unless-stopped

  # Reverb pub/sub. Uses clue/redis-react, so the app image needs no ext-redis.
  redis:
    image: redis:${REDIS_VERSION:-8.8.1-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    profiles:
      - infra
    restart: unless-stopped

  openobserve:
    image: openobserve/openobserve:${OPENOBSERVE_VERSION:-v0.91.5}
    environment:
      ZO_ROOT_USER_EMAIL: *oo_user
      ZO_ROOT_USER_PASSWORD: *oo_password
      ZO_DATA_DIR: /data
      # Browser RUM posts cross-origin, so its origin must be allow-listed. Defaults cover local dev
      # and preview; add production domains.
      ZO_CORS_ALLOWED_ORIGINS: ${ZO_CORS_ALLOWED_ORIGINS:-http://localhost:8000,https://localhost}
    # No healthcheck: the image is distroless, with no curl, wget or shell to run one with, so any CMD
    # here reports unhealthy forever and `up --wait` never returns. `mise up` polls /healthz from the host
    # instead, which is what the app's boot-time RUM token fetch needs to have happened.
    ports:
      - 127.0.0.1:${OPENOBSERVE_PORT:-5080}:5080
    profiles:
      - infra
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.30.6}
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - 1025:1025
      - 8025:8025
    profiles:
      - infra
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION:-4.40}
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -filer -master.volumeSizeLimitMB=1024
    configs:
      - source: seaweedfs_s3
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - 8333:8333
      - 8888:8888
    profiles:
      - infra
    restart: unless-stopped

  server:
    <<: *app_config
    ports:
      - 8000:8000

  reverb:
    <<: *app_config
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    ports:
      - 8080:8080
    command: ["php", "artisan", "reverb:start"]

  worker:
    <<: *app_config
    healthcheck:
      disable: true
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-jobs=1000", "--max-time=3600"]
