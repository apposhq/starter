# Defined once so the credential is not repeated between openobserve and the services shipping it telemetry.
x-oo_user: &oo_user ${ZO_ROOT_USER_EMAIL:-root@appos.sh}
x-oo_password: &oo_password ${ZO_ROOT_USER_PASSWORD:-Openobserve1!}

# Only settings that differ from the image or config default appear here. The internal ports are not
# among them: the Caddyfile addresses server:8000 and reverb:8080 directly, so a PORT or REVERB_PORT
# override would move the listener and leave the proxy pointing at nothing. PROXY_HTTP_PORT and
# PROXY_HTTPS_PORT are the ports that can actually be changed.
x-app_config: &app_config
  build:
    context: .
    dockerfile: ./Dockerfile
  environment:
    APP_DEBUG: ${APP_DEBUG:-false}
    APP_KEY: ${APP_KEY:-base64:g7J5n6MtDAj0ppG9TbzJ6eLWXcQgtPK0HufPZLo8Td0=}
    APP_URL: ${APP_URL:-http://localhost:8000}
    DB_URL_PRIMARY: ${DB_URL_PRIMARY:-postgresql://postgres:postgres@postgres:5432/primary}
    GIT_ROOT: ${GIT_ROOT:-/data/repos}
    OO_OTLP_ENDPOINT: ${OO_OTLP_ENDPOINT:-http://openobserve:5080/api/default}
    OO_PASSWORD: *oo_password
    OO_USER: *oo_user
    # Redis pub/sub fans broadcasts across reverb replicas.
    REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    REVERB_HOST: ${REVERB_HOST:-reverb}
    REVERB_SCALING_ENABLED: ${REVERB_SCALING_ENABLED:-true}
  # The server and worker share the repos volume; git's lockfiles make concurrent access safe.
  volumes:
    - repos:/data/repos
  profiles:
    - app
  restart: unless-stopped
  # Let in-flight requests and jobs finish on SIGTERM before the SIGKILL. With >=2 replicas, this is
  # what makes the rolling swap lossless.
  stop_grace_period: 30s

configs:
  caddyfile:
    content: |
      {$$CADDY_SITE_ADDRESS} {
      	handle /app/* {
      		reverse_proxy {
      			dynamic a reverb 8080
      		}
      	}
      	handle /apps/* {
      		reverse_proxy {
      			dynamic a reverb 8080
      		}
      	}
      	handle {
      		reverse_proxy {
      			dynamic a server 8000
      		}
      	}
      }

  postgres_initdb:
    content: |
      \set databases `echo "$$POSTGRES_DATABASES"`
      SELECT format('CREATE DATABASE %I', name)
      FROM unnest(string_to_array(:'databases', ',')) AS base,
           LATERAL (VALUES (base), (base || '_test')) AS n(name)
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = n.name)
      \gexec

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-19beta1}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # Every database the application connects to, comma separated. This is the only place they are
      # declared: the init script below creates each one alongside a `<name>_test` companion, because
      # the suite's RefreshDatabase drops every table and must not do that to development data.
      # POSTGRES_DB is deliberately unset so this list stays the single source.
      POSTGRES_DATABASES: ${POSTGRES_DATABASES:-primary}
      # The pgdata volume below is only the data directory if PGDATA points at it. Without this the
      # image keeps its own default (/var/lib/postgresql/19/docker, which carries the major version),
      # the declared volume stays empty, and the cluster lands in the anonymous volume Docker creates
      # for the image's VOLUME /var/lib/postgresql. That still persists, but under a name nothing
      # references, so the declaration below reads as persistence that is not happening.
      PGDATA: /home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY:-1G}
    ports:
      - ${INFRA_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432
    profiles:
      - infra
    configs:
      - source: postgres_initdb
        target: /docker-entrypoint-initdb.d/create-databases.sql
    volumes:
      - pgdata:/home/postgres/pgdata
    restart: unless-stopped

  # Reverb pub/sub. Uses clue/redis-react, so the app image needs no ext-redis.
  redis:
    image: redis:${REDIS_VERSION:-8.8.1-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEMORY:-256M}
    ports:
      - ${INFRA_BIND:-127.0.0.1}:${REDIS_PORT:-6379}:6379
    profiles:
      - infra
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # Observability (logs, metrics, traces, RUM, session replay) for the primary and its apps; backs
  # the per-app dashboards and the @appos/o11y primitive. Single binary, ~140x cheaper than ELK/Datadog.
  openobserve:
    image: openobserve/openobserve:${OPENOBSERVE_VERSION:-v0.91.2}
    environment:
      ZO_ROOT_USER_EMAIL: *oo_user
      ZO_ROOT_USER_PASSWORD: *oo_password
      ZO_DATA_DIR: /data
      # Browser RUM posts cross-origin, so its origin must be allow-listed. Defaults cover local dev
      # and preview; add production domains.
      ZO_CORS_ALLOWED_ORIGINS: ${ZO_CORS_ALLOWED_ORIGINS:-http://localhost:8000,https://localhost}
    ports:
      - ${INFRA_BIND:-127.0.0.1}:${OPENOBSERVE_PORT:-5080}:5080
    profiles:
      - infra
    volumes:
      - o2data:/data
    restart: unless-stopped

  server:
    <<: *app_config
    deploy:
      resources:
        limits:
          memory: ${SERVER_MEMORY:-1G}

  # Single entrypoint so server and reverb can both scale; caddy re-resolves replicas via dynamic a.
  proxy:
    image: caddy:${CADDY_VERSION:-2.11.4-alpine}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    deploy:
      resources:
        limits:
          memory: ${PROXY_MEMORY:-256M}
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-:80}
    ports:
      - ${PROXY_HTTP_PORT:-8000}:80
      - ${PROXY_HTTPS_PORT:-8443}:443
    profiles:
      - app
    restart: unless-stopped
    # Persist issued certificates; without this prod re-requests on every restart and hits ACME limits.
    volumes:
      - caddydata:/data

  # Separate from `server` so websocket and http load scale independently.
  reverb:
    <<: *app_config
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${REVERB_MEMORY:-512M}
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]

  # Recycle limits cap memory growth in the long-lived worker.
  worker:
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY:-256M}
    <<: *app_config
    # Shares the image but serves no HTTP, so the image healthcheck cannot apply.
    healthcheck:
      disable: true
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-jobs=1000", "--max-time=3600"]

volumes:
  caddydata:
  pgdata:
  o2data:
  redisdata:
  repos:
